<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>隔离笔记验收</title>
<style>
:root{color-scheme:light;--ink:#172f2b;--muted:#526b62;--line:#d5e0d8;--ground:#edf1ec;--soft:#f5f8f4;--accent:#245c48;--accent-hover:#174b39;--error:#a32e36}
*{box-sizing:border-box}html{min-width:320px}body{margin:0;background:var(--ground);color:var(--ink);font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif}main{width:min(100% - 36px,800px);margin:40px auto 60px;background:#fff;border-radius:18px;box-shadow:0 18px 44px rgba(0,0,0,.08);overflow:hidden}
header{padding:28px 34px 24px;background:#193b31;color:#fff}h1{font-size:clamp(25px,4vw,34px);line-height:1.2;letter-spacing:-.025em;margin:0 0 8px;font-weight:720}header p{margin:0;color:#d1e5d7;font-size:14px}
section{padding:26px 34px}.compose{background:var(--soft);border-bottom:1px solid var(--line)}.library{padding-top:24px}.section-heading{font-size:20px;line-height:1.35;letter-spacing:-.015em;margin:0 0 15px;font-weight:680}.section-heading+p{margin:-7px 0 16px;color:var(--muted);font-size:14px}
label{display:block;font-size:14px;font-weight:650;margin-bottom:8px}textarea,input,button{font:inherit}textarea,input{display:block;width:100%;padding:12px 14px;border:1px solid #a7bcb0;border-radius:10px;background:#fff;color:var(--ink);outline:none;transition:border-color .16s,box-shadow .16s}textarea{min-height:118px;resize:vertical;line-height:1.55}textarea:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,92,72,.16)}textarea[aria-invalid=true]{border-color:var(--error)}button{border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:650;min-height:46px;padding:10px 20px;cursor:pointer;transition:background .16s,transform .16s}button:hover{background:var(--accent-hover)}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid #8bbda1;outline-offset:2px}button:disabled{opacity:.6;cursor:wait;transform:none}
#create-form button{display:block;margin:14px 0 0 auto}#note-error{color:var(--error);font-size:14px;margin:8px 0 0}#note-error:empty{display:none}#status{display:inline-block;min-height:28px;margin:12px 0 0;padding:3px 0;color:var(--muted);font-size:14px}
#search-form{margin:0 0 20px}#search-form .search-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}#query{min-width:0}#count{font-size:14px;font-weight:650;color:var(--muted);margin:0 0 8px;padding-bottom:10px;border-bottom:1px solid var(--line)}#notes{padding:0;margin:0;list-style:none}#notes li{white-space:pre-wrap;overflow-wrap:anywhere;padding:17px 2px;border-bottom:1px solid var(--line);line-height:1.65}#notes li:last-child{border-bottom:0}small{display:block;margin-top:22px;color:var(--muted);font-size:12px;line-height:1.5}
::selection{background:#b8dac2;color:#153629}
@media(max-width:560px){main{width:100%;margin:0;min-height:100vh;border-radius:0;box-shadow:none}header{padding:23px 22px 20px}section{padding:21px 22px}.library{padding-top:20px}.section-heading{font-size:19px;margin-bottom:12px}textarea{min-height:104px}#search-form .search-row{gap:8px}#search-form button{padding-inline:16px}#notes li{padding-block:14px}}
</style>
<main><header><h1>隔离笔记验收</h1><p>真实本地服务 · 测试数据 · 无外部费用</p></header>
<section class="compose" aria-labelledby="write-heading"><h2 class="section-heading" id="write-heading">写下一条笔记</h2><p>保存后会从本地服务重新读回结果。</p>
<form id="create-form"><label for="note">笔记正文</label><textarea id="note" maxlength="2000" aria-describedby="note-error" aria-invalid="false"></textarea><p id="note-error"></p><button type="submit">保存笔记</button></form>
<p id="status" role="status" aria-live="polite">正在加载笔记…</p></section>
<section class="library" aria-labelledby="list-heading"><h2 class="section-heading" id="list-heading">已保存笔记</h2>
<form id="search-form"><label for="query">搜索笔记</label><div class="search-row"><input id="query" type="search"><button type="submit">搜索</button></div></form>
<p id="count"></p><ul id="notes"></ul><small>数据会在刷新和服务重启后保留；未来同步尚未实现。</small></section></main>
<script>
const note=document.querySelector('#note'),query=document.querySelector('#query'),status=document.querySelector('#status'),list=document.querySelector('#notes'),count=document.querySelector('#count'),noteError=document.querySelector('#note-error'),saveButton=document.querySelector('#create-form button');
let loadSerial=0;
async function load(){const serial=++loadSerial;let r,data;try{r=await fetch('/api/notes?q='+encodeURIComponent(query.value));data=await r.json();}catch{if(serial!==loadSerial)return {stale:true,notes:[]};throw Error('请求未完成，当前结果未更新，请重试');}if(serial!==loadSerial)return {stale:true,notes:data.notes||[]};if(!r.ok)throw Error(typeof data.error==='string'?data.error:'请求未完成，请重试');list.replaceChildren();for(const n of data.notes){const li=document.createElement('li');li.textContent=n.text;li.dataset.noteId=n.id;list.append(li)}count.textContent=data.notes.length?`共 ${data.notes.length} 条笔记`:(query.value.trim()?'没有匹配笔记':'还没有笔记');return {stale:false,notes:data.notes};}
function fieldError(message){noteError.textContent=message;note.setAttribute('aria-invalid',message?'true':'false');if(message)note.focus();}
let pendingSave=null,saving=false;
async function confirmSave(attempt){try{const r=await fetch('/api/notes?requestId='+encodeURIComponent(attempt.requestId));if(!r.ok)return false;const data=await r.json();const found=data.notes?.find(n=>n.requestId===attempt.requestId&&n.text===attempt.text);if(!found)return false;query.value='';const current=await load();if(!current.notes.some(n=>n.id===found.id&&n.text===found.text))return false;pendingSave=null;note.value='';fieldError('');status.textContent='已保存并读回笔记';return true;}catch{return false;}}
document.querySelector('#create-form').addEventListener('submit',async e=>{e.preventDefault();if(saving)return;const text=note.value.trim();if(!text){fieldError('请输入笔记正文');status.textContent='请输入笔记正文';return;}fieldError('');if(!pendingSave||pendingSave.text!==text)pendingSave={text,requestId:crypto.randomUUID()};const attempt=pendingSave;saving=true;saveButton.disabled=true;status.textContent='正在保存并读取结果…';try{let r,data;try{r=await fetch('/api/notes',{method:'POST',headers:{'content-type':'application/json','idempotency-key':attempt.requestId},body:JSON.stringify({text})});data=await r.json();}catch{}if(r&&r.status>=400&&r.status<500){const message=typeof data?.error==='string'?data.error:'请检查输入后重试';fieldError(message);status.textContent='保存未完成：'+message;pendingSave=null;return;}if(await confirmSave(attempt))return;status.textContent='保存结果暂时无法确认；输入已保留，检查列表或重试本次请求。';}finally{saving=false;saveButton.disabled=false;}});
document.querySelector('#search-form').addEventListener('submit',async e=>{e.preventDefault();status.textContent='正在搜索…';try{const result=await load();if(!result.stale)status.textContent='搜索完成';}catch(error){status.textContent='搜索未完成：'+error.message;}});
load().then(result=>{if(!result.stale)status.textContent='笔记已加载';}).catch(e=>status.textContent='加载未完成：'+e.message);
</script></html>
